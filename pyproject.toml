[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insultgen"
description = "Algorithmic English insult generator driven by a curated, structured vocabulary."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = []
keywords = ["natural-language-generation", "nlg", "vocabulary", "linguistics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# TODO: add a `license` entry once a license is chosen (see LICENSE).

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
insultgen = "insultgen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "insultgen.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insultgen = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "examples"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
